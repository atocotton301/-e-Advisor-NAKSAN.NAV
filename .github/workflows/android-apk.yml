name: 안드로이드 APK 빌드

on:
  push:
    branches: [main]
    paths:
      - "04_개발/naksan-nav/apps/web/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: 04_개발/naksan-nav/apps/web

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 웹 빌드
        run: |
          npm ci
          npm run build:app

      - name: 안드로이드 프로젝트 생성
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: APK 빌드
        working-directory: 04_개발/naksan-nav/apps/web/android
        run: |
          mkdir -p ~/.android
          cp ../mobile/test.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../NAKSAN-NAV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NAKSAN-NAV-apk
          path: 04_개발/naksan-nav/apps/web/NAKSAN-NAV.apk

      - name: 최신 APK 릴리스 갱신
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest NAKSAN-NAV.apk \
            --title "NAKSAN.NAV 안드로이드 테스트 앱" \
            --notes "main 최신 커밋으로 자동 빌드된 테스트용 APK입니다. 갤럭시폰·갤럭시탭에서 받아서 설치하세요." \
            --prerelease --target "${{ github.sha }}"
